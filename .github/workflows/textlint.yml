name: Run textlint for all contents

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
      with:
        aqua_version: v2.63.0
    - name: Setup workspace
      run: task setup-ci
    - name: Run textlint
      run: task textlint -- articles books
